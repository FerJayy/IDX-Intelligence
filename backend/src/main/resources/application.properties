spring.application.name=backend

# Secrets live in backend/.env (git-ignored). Copy .env.example to .env and fill it in.
# Real environment variables (e.g. on the hosting platform) take precedence over .env.
spring.config.import=optional:file:.env[.properties]

# Render tells the app which port to use via PORT; SERVER_PORT (local checks) still wins.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Neon's free tier sleeps after a few idle minutes; the first connection can take a few seconds.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# Accounts. SITE_URL = the website's address, used in password-reset links.
app.site-url=${SITE_URL:http://localhost:3000}
# Password-reset emails go out through Gmail (MAIL_USERNAME = the site's Gmail address,
# MAIL_PASSWORD = its 16-character app password). Without them, no email is sent.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
